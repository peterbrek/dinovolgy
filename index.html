<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E7DECD">
<meta name="description" content="Montessori-szerű számolós játék dínókkal: számlálás, összeadás, sorba rendezés.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dínóvölgy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="baloo2-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<title>Dínóvölgy</title>
<style>
@font-face{font-family:'Baloo 2';font-style:normal;font-display:swap;font-weight:400 800;src:url(baloo2-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-style:normal;font-display:swap;font-weight:400 800;src:url(baloo2-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Nunito';font-style:normal;font-display:swap;font-weight:200 1000;src:url(nunito-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Nunito';font-style:normal;font-display:swap;font-weight:200 1000;src:url(nunito-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
[hidden]{display:none!important}
/* Layout: a fixed 1180×820 iPad-landscape stage scaled to fit; an illustrated valley with paper cards and pebble buttons */
:root{
  --paper:#F4EDE1;
  --card:#FBF7EF;
  --frame:#E7DECD;
  --ink:#2E3A33;
  --ink-soft:#4A5650;
  --leaf:#3F6B4B;
  --leaf-deep:#2A4B34;
  --leaf-wash:#E7F0DF;
  --sun:#F2C76B;
  --clay:#E8945A;
  --sand:#E5DCCB;
  --sand-deep:#C9BCA4;
  --line:#D9CDB8;
  --meadow:#E3EDD9;
  --mist:#A9C9D6;
  --danger:#A6402B;
  --display:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --lift:0 4px 0 rgba(46,58,51,.14);
}
html{height:100%;box-sizing:border-box;color-scheme:light;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{height:100%;box-sizing:border-box;margin:0;background:var(--frame);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;box-sizing:border-box;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden;border-radius:28px;background:var(--paper);line-height:1.25}
#rotate-hint{margin:0;font-size:18px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
button{font:inherit;color:inherit;border:none;background:none;padding:0;margin:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
input{-webkit-user-select:text;user-select:text}
.screen{position:absolute;inset:0;overflow:hidden}
h1,h2,p{margin:0}
h1,h2{text-wrap:balance}

/* shared pieces */
.round-btn{width:72px;height:72px;flex:none;border-radius:999px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--lift)}
.round-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(46,58,51,.14)}
.abs-tl{position:absolute;top:28px;left:40px;z-index:5}
.topbar{position:absolute;top:28px;left:40px;right:40px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;z-index:4}
.instr{display:flex;align-items:center;gap:14px;padding:18px 30px;background:var(--card);border-radius:999px;box-shadow:var(--lift);font-size:24px;font-weight:600;line-height:1.2;min-width:0}
.dots{display:flex;align-items:center;gap:8px;flex:none}
.dot{width:14px;height:14px;border-radius:999px;background:var(--line);display:inline-block}
.dot.on{background:var(--leaf)}
.dots b{margin-left:6px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bubble{position:relative;width:100%;box-sizing:border-box;background:var(--card);border-radius:28px;padding:20px 24px;font-size:24px;font-weight:600;line-height:1.3;box-shadow:var(--lift)}
.bubble::after{content:"";position:absolute;left:var(--tail,140px);bottom:-11px;width:22px;height:22px;background:var(--card);transform:rotate(45deg)}
.bubble .btn{margin-top:14px}
.answer-row,.done-sheet{position:absolute;left:40px;right:40px;bottom:32px;height:128px;box-sizing:border-box;border-radius:36px;display:flex;align-items:center;gap:24px}
.answer-row{padding:0 28px 0 36px;background:var(--card);box-shadow:0 6px 0 rgba(46,58,51,.12)}
.answer-row .q{flex:1;font-size:30px;font-weight:700}
.done-sheet{padding:0 24px 0 24px;background:var(--leaf-wash);box-shadow:0 6px 0 rgba(63,107,75,.28);animation:sheetIn .4s cubic-bezier(.3,1.4,.5,1);z-index:6}
.done-sheet .msg{flex:1;font-size:30px;font-weight:700;line-height:1.2}
.check{width:76px;height:76px;flex:none;border-radius:999px;background:var(--leaf);display:flex;align-items:center;justify-content:center}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.stone{width:128px;height:96px;flex:none;background:var(--sand);box-shadow:0 6px 0 var(--sand-deep);font-size:54px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.stone:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sand-deep)}
.r1{border-radius:48% 52% 46% 54%/55% 50% 50% 45%}
.r2{border-radius:52% 48% 54% 46%/50% 55% 45% 50%}
.r3{border-radius:46% 54% 50% 50%/52% 48% 52% 48%}
.wiggle{animation:wiggle .5s}
@keyframes wiggle{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;font-weight:700;white-space:nowrap}
.btn-primary{background:var(--leaf);color:#FFFFFF;padding:18px 34px;font-size:26px;box-shadow:0 6px 0 var(--leaf-deep)}
.btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--leaf-deep)}
.btn-soft{background:var(--card);color:var(--ink);padding:18px 30px;font-size:24px;box-shadow:0 6px 0 rgba(46,58,51,.15)}
.btn-soft:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(46,58,51,.15)}
.btn.small{padding:12px 22px;font-size:22px}

/* home */
.scene{position:absolute;left:0;top:0}
.cloud{animation:drift 38s ease-in-out infinite alternate}
.cloud.slow{animation-duration:52s}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
.home-head{position:absolute;top:34px;left:48px;right:48px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;z-index:3}
.home-head h1{font-size:48px;font-weight:700;line-height:1.1}
.home-head p{font-size:24px;margin-top:6px}
.head-actions{display:flex;align-items:center;gap:14px}
.pill{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;background:var(--card);border-radius:999px;font-size:24px;font-weight:700;box-shadow:var(--lift)}
.pill:active{transform:translateY(3px)}
.pill-count{padding:3px 12px;border-radius:999px;background:var(--sun);font-size:19px;font-variant-numeric:tabular-nums}
.pill-hatch{background:var(--sun);animation:nudge 2.4s ease-in-out infinite;padding-right:22px}
@keyframes nudge{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}95%{transform:rotate(-2deg)}}
.lockwrap{position:relative}
.lockbtn{position:relative;width:56px;height:56px;border-radius:999px;background:#EEF3EE;display:flex;align-items:center;justify-content:center}
.lockbtn .ring{position:absolute;inset:-4px;width:64px;height:64px;transform:rotate(-90deg);pointer-events:none}
.lockbtn .ring circle{fill:none;stroke:var(--leaf);stroke-width:4;stroke-dasharray:183;stroke-dashoffset:183}
.lockbtn.holding .ring circle{animation:ringfill 2s linear forwards}
@keyframes ringfill{to{stroke-dashoffset:0}}
.holdtip{position:absolute;right:0;top:66px;white-space:nowrap;background:var(--ink);color:#FFFFFF;font-size:18px;font-weight:600;padding:8px 14px;border-radius:14px}
.cards{position:absolute;left:48px;right:48px;bottom:40px;display:grid;gap:28px;z-index:3}
.card{display:flex;flex-direction:column;height:364px;box-sizing:border-box;padding:14px;background:var(--card);border-radius:36px;box-shadow:0 8px 0 rgba(46,58,51,.18);text-align:left;min-width:0}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(46,58,51,.18)}
.card-art{height:186px;border-radius:26px;overflow:hidden;flex:none}
.card-art svg{display:block;width:100%;height:100%}
.card-body{display:flex;flex-direction:column;gap:4px;padding:16px 10px 2px;flex:1}
.card-title{font-size:32px;font-weight:700;line-height:1.15}
.card-sub{font-size:21px;line-height:1.3}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.chip{padding:6px 14px;border-radius:999px;font-size:18px;font-weight:600}
.play{width:52px;height:52px;border-radius:999px;background:var(--leaf);display:flex;align-items:center;justify-content:center}
.vdino{position:absolute;z-index:2;transform-origin:50% 100%}
.vdino svg{display:block}
.vd-art{display:block;transform-origin:50% 100%}
.vd-art.bounce{animation:bounce .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-26px) scale(1.04,.96)}60%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.vdino.fly{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.newbadge{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--clay);color:var(--ink);font-size:17px;font-weight:700;padding:3px 12px;border-radius:999px;white-space:nowrap}
.vbubble{position:absolute;z-index:7;width:280px;box-sizing:border-box;background:var(--card);border-radius:22px;padding:14px 18px;font-size:21px;font-weight:600;line-height:1.25;box-shadow:var(--lift);animation:sheetIn .3s ease-out;pointer-events:none}

/* counting */
.nest-panel{position:absolute;left:40px;top:124px;width:760px;height:512px;border-radius:40px;background:var(--meadow);overflow:hidden}
.nest-panel>svg{position:absolute;left:0;top:0}
.egg{position:absolute}
.egg svg{display:block;transition:transform .12s}
.egg:active svg{transform:scale(.94)}
.egg .badge{position:absolute;border-radius:999px;background:var(--leaf);color:#FFFFFF;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.egg.pop .badge{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
.side-col{position:absolute;top:124px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.cnt-lab{position:absolute;top:18px;font-size:19px;font-weight:700;color:var(--ink-soft)}
.carton{position:absolute;width:164px;height:96px}
.legg{position:absolute;width:52px;height:64px}
.carton svg,.legg svg{display:block;transition:transform .12s}
.carton:active svg,.legg:active svg{transform:scale(.95)}
.carton .badge,.legg .badge{position:absolute;border-radius:999px;background:var(--leaf);color:#FFFFFF;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.carton .badge{width:64px;height:64px;left:50px;top:16px;font-size:32px;box-shadow:0 0 0 4px rgba(251,247,239,.75)}
.legg .badge{width:42px;height:42px;left:5px;top:14px;font-size:21px}
.carton.pop .badge,.legg.pop .badge{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}

/* addition */
.equation{position:absolute;top:116px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px}
.eq-num{width:92px;height:80px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:700}
.eq-op{font-size:56px;font-weight:700}
.eq-q{width:92px;height:80px;box-sizing:border-box;border-radius:24px;border:4px dashed var(--ink);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700}
.branches{position:absolute;left:40px;top:216px;width:372px;display:flex;flex-direction:column;gap:20px}
.branch{height:190px;box-sizing:border-box;padding:20px;background:var(--card);border-radius:32px;display:flex;align-items:center;gap:14px}
.branch-lab{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.branch-num{width:60px;height:60px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
.branch-lab span:last-child{font-size:17px;font-weight:600}
.berries{display:grid;grid-template-columns:repeat(5,46px);gap:8px 6px}
.berry,.berry-gone{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.berry:active{transform:scale(.9)}
.berry-gone span{width:38px;height:38px;box-sizing:border-box;border-radius:999px;border:3px dashed #D3C6AF}
.bowl-panel{position:absolute;left:440px;top:216px;width:700px;height:400px;box-sizing:border-box;padding:24px;background:var(--meadow);border-radius:40px;display:flex;gap:24px}
.frames{width:352px;flex:none;display:flex;flex-direction:column;gap:12px;justify-content:center}
.frames-lab{font-size:22px;font-weight:700}
.frame{box-sizing:border-box;padding:10px;background:#B98552;border-radius:22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cell{height:56px;border-radius:16px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.cell span{width:40px;height:40px;border-radius:999px}
.cell span.new{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.pile{height:150px;box-sizing:border-box;border-radius:20px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 6px 8px;flex:none}
.pile svg{display:block}
.pile.tens{width:164px}
.pile.ones{width:80px}
.pile:active{transform:scale(.96)}
.pile:disabled{background:transparent;box-shadow:inset 0 0 0 3px #E2D8C6;cursor:default}
.pile:disabled:active{transform:none}
.pile-lab{font-size:16px;font-weight:700;color:var(--ink-soft)}
.mat{box-sizing:border-box;padding:10px;background:#B98552;border-radius:22px;display:flex;gap:10px}
.mat-col{box-sizing:border-box;background:var(--paper);border-radius:16px;padding:8px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mat-col.tens{width:196px}
.mat-col.ones{width:126px}
.mat-lab{font-size:16px;font-weight:700;color:var(--ink-soft)}
.mat svg{display:block}
.pv-new{animation:pop .3s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}

/* ordering */
.river-panel{position:absolute;left:40px;top:124px;width:1100px;height:420px;border-radius:40px;background:#A9C79E;overflow:hidden}
.river-panel>svg{position:absolute;left:0;top:0}
.slot{position:absolute;top:168px;width:104px;height:84px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700}
.slot.empty{border:4px dashed var(--card);background:rgba(251,247,239,.25)}
.slot.full{background:var(--sand);box-shadow:0 6px 0 #B8AC95}
.slot.full.new{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.walker{position:absolute;left:14px;top:232px;width:202px;height:156px;z-index:2}
.walker svg{display:block}
.river-bubble{position:absolute;left:24px;top:24px;width:380px;z-index:3}
.river-bubble .bubble{font-size:23px;padding:18px 22px}
.tray{position:absolute;left:40px;right:40px;bottom:32px;height:200px;box-sizing:border-box;padding:20px 36px 28px;background:var(--card);border-radius:36px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 rgba(46,58,51,.12)}
.tray-lab{font-size:24px;font-weight:700}
.tray-row{display:flex;justify-content:center;gap:32px}
.tray .stone{width:140px;height:104px;font-size:56px}
.stone-gone{width:140px;height:104px;box-sizing:border-box;border:3px dashed #D3C6AF;flex:none}

/* success */
.success{background:#F7EBCB}
.done-chip{position:absolute;top:40px;left:0;right:0;display:flex;justify-content:center}
.done-chip span{display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;background:var(--card);font-size:21px;font-weight:600}
.success-art{position:absolute;top:96px;left:0;right:0;display:flex;justify-content:center}
.success-text{position:absolute;top:426px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 80px}
.success-text h1{font-size:66px;font-weight:700;line-height:1.1}
.success-text p{font-size:28px;max-width:860px}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px}
.meter-lab{margin-left:6px;padding:4px 14px;border-radius:999px;background:var(--sun);font-size:20px;font-weight:700}
.success-actions{position:absolute;bottom:64px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px}
.new-egg{transform-box:fill-box;transform-origin:50% 90%;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-7deg)}76%{transform:rotate(6deg)}84%{transform:rotate(-4deg)}92%{transform:rotate(2deg)}}

/* hatching */
.hatch{background:#F7EBCB}
.hatch-wrap{position:absolute;left:270px;top:16px;width:640px;height:440px}
.hatch-wrap>svg{display:block}
.egg-hit{position:absolute;left:227px;top:111px;width:186px;height:243px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%}
.egg-anim{transform-box:fill-box;transform-origin:50% 92%}
.egg-anim.knock{animation:knock .45s ease-in-out}
@keyframes knock{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.crack{opacity:0;transition:opacity .15s}
.st1 .c1,.st2 .c2,.st3 .c3{opacity:1}
.shell{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.opened .egg-whole{opacity:0}
.opened .shell{opacity:1}
.opened .shell-top{animation:shellTop .9s .05s ease-out forwards}
@keyframes shellTop{to{transform:translate(-90px,-120px) rotate(-60deg);opacity:0}}
.opened .shell-bot{animation:shellBot .6s .8s ease-in forwards}
@keyframes shellBot{to{transform:translateY(34px) scale(.9);opacity:0}}
.dino-pop{opacity:0;transform:translateY(30px) scale(.35);transform-box:fill-box;transform-origin:50% 100%}
.opened .dino-pop{animation:popin .9s .2s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes popin{to{opacity:1;transform:translateY(0) scale(1)}}
.spark{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.opened .spark{animation:spark 1.2s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.25) rotate(45deg)}100%{opacity:.85;transform:scale(.8) rotate(90deg)}}
.done .shell{display:none}
.done .dino-pop{animation:none;opacity:1;transform:none}
.done .spark{animation:none;opacity:.85}
.hatch-text{position:absolute;left:120px;right:120px;top:470px;bottom:24px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;text-align:center}
.hatch-hint{font-size:34px;font-weight:700;margin-top:24px}
.tapdots{display:flex;gap:12px}
.tapdots .dot{width:18px;height:18px}
.hatch-card{display:flex;flex-direction:column;align-items:center;gap:8px;animation:sheetIn .5s ease-out}
.hatch-card .new-chip{padding:6px 16px;border-radius:999px;background:var(--clay);font-size:20px;font-weight:700}
.name-row{display:flex;align-items:center;gap:12px;justify-content:center}
.dname{font-size:56px;font-weight:700;line-height:1.05}
.pencil{width:52px;height:52px;border-radius:999px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--lift);flex:none}
#dino-name{font-family:var(--display);font-size:36px;font-weight:700;color:var(--ink);background:#FFFFFF;border:3px solid var(--line);border-radius:18px;padding:6px 16px;width:300px;box-sizing:border-box}
.kind{font-size:20px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.desc{font-size:24px;line-height:1.35;max-width:720px}
.hatch-actions{display:flex;gap:18px;margin-top:10px}

/* dino collection */
.dex-top{position:absolute;top:28px;left:40px;right:40px;height:72px;display:flex;align-items:center;gap:20px}
.dex-top h1{flex:1;font-size:46px;font-weight:700}
.next-egg{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--card);border-radius:999px;font-size:21px;font-weight:600}
.dex-left{position:absolute;left:40px;top:124px;width:400px;height:664px;box-sizing:border-box;padding:28px;background:#F6E3C4;border-radius:40px;display:flex;flex-direction:column;gap:10px}
.dex-left .name-row{justify-content:flex-start}
.dex-left .dname{font-size:48px}
.dex-left #dino-name{width:230px;font-size:30px}
.dex-left .desc{font-size:21px}
.dex-left .kind{font-size:18px}
.dex-chip{align-self:flex-start;padding:6px 16px;border-radius:999px;background:var(--clay);font-size:19px;font-weight:700}
.dex-chip.calm{background:var(--card)}
.dex-art{display:flex;justify-content:center;background:#F0D4A8;border-radius:28px;padding:12px 0}
.dex-left .btn{margin-top:auto}
.dex-right{position:absolute;left:468px;top:124px;width:672px;height:664px;box-sizing:border-box;padding:28px;background:var(--card);border-radius:40px;display:flex;flex-direction:column;gap:20px}
.dex-right-head{display:flex;align-items:center;justify-content:space-between}
.dex-right-head h2{font-size:30px;font-weight:700}
.dex-count{padding:4px 14px;border-radius:999px;background:var(--meadow);font-size:20px;font-weight:700}
.dex-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px;flex:1}
.dcard{position:relative;box-sizing:border-box;padding:14px 8px;background:var(--paper);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-width:0}
.dcard.sel{box-shadow:inset 0 0 0 4px var(--leaf)}
.dcard:active{transform:scale(.97)}
.dcard .dn{font-size:25px;font-weight:700}
.dcard .dk{font-size:16px;color:var(--ink-soft)}
.dcard .newtag{position:absolute;top:10px;right:10px;padding:2px 10px;border-radius:999px;background:var(--clay);font-size:16px;font-weight:700}
.dcard.locked{background:#EEE6D6;gap:10px}
.dcard.locked span{font-size:18px;font-weight:600;color:#5C5040}

/* parent corner */
.parent{background:var(--paper);font-family:var(--body)}
.ptop{position:absolute;top:28px;left:40px;right:40px;height:72px;display:flex;align-items:center;justify-content:space-between}
.ptop h1{font-family:var(--display);font-size:44px;font-weight:700}
.ptop .btn{font-family:var(--display)}
.pcard{position:absolute;top:124px;height:664px;box-sizing:border-box;padding:24px 28px;background:var(--card);border-radius:32px;display:flex;flex-direction:column}
.pcard h2{font-family:var(--display);font-size:28px;font-weight:700;margin-bottom:6px}
.pset{left:40px;width:572px}
.pstats{left:636px;width:504px;gap:14px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;border-bottom:1px solid #EDE5D6;font-size:19px;font-weight:700}
.prow:last-child{border-bottom:none}
.prow.wrap{flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:12px 0}
#kid-name{font-family:var(--body);font-size:19px;font-weight:600;color:var(--ink);padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#FFFFFF;width:230px;box-sizing:border-box}
.seg{display:flex;background:#EDE5D6;border-radius:999px;padding:4px;gap:2px}
.seg button{padding:10px 20px;border-radius:999px;font-family:var(--body);font-size:18px;font-weight:700;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#FFFFFF}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chipt{padding:9px 16px;border-radius:999px;border:2px solid var(--line);font-family:var(--body);font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.chipt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-wash)}
.chipt[aria-pressed="false"]{color:var(--ink-soft)}
.bk-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;width:100%}
.bk-in{flex:1;min-width:0;font-family:var(--body);font-size:16px;font-weight:600;color:var(--ink);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#FFFFFF;box-sizing:border-box}
#bk-out{width:100%}
.pnote.ok{color:var(--leaf)}
.pnote.err{color:var(--danger)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--paper);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:16px;font-weight:700;color:var(--ink-soft)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EDE5D6;font-size:18px;font-weight:600}
.plist li b{font-variant-numeric:tabular-nums}
.pnote{font-size:16px;line-height:1.45;color:var(--ink-soft);font-weight:600}
.reset-row{margin-top:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.linkbtn{font-family:var(--body);font-size:17px;font-weight:800;color:var(--danger);padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.reset-q{font-size:17px;font-weight:700;flex-basis:100%}
.dangerbtn{background:var(--danger);color:#FFFFFF;padding:10px 18px;border-radius:999px;font-family:var(--body);font-size:17px;font-weight:800}
.plainbtn{background:#EDE5D6;padding:10px 18px;border-radius:999px;font-family:var(--body);font-size:17px;font-weight:800}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}

/* ---------- helpers ---------- */
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function choices(c, lo, hi){
  const ok = x => x>=lo && x<=hi;
  const adj = [c-1,c+1].filter(ok), far = [c-2,c+2].filter(ok);
  const first = pick(adj.length?adj:far);
  const rest = shuffle(adj.concat(far).filter(x=>x!==first));
  return [c, first, rest[0]].sort((a,b)=>a-b);
}
function choices100(c){
  const ok = x => x>=1 && x<=100;
  const tens = [c-10,c+10].filter(ok), ones = [c-1,c+1].filter(ok);
  return [c, pick(tens), pick(ones)].sort((a,b)=>a-b);
}
const dinoById = id => DINOS.find(d=>d.id===id);
const dinoName = id => (P.names && P.names[id]) || dinoById(id).name;
const allHatched = () => DINOS.every(d=>P.hatched.includes(d.id));
const nextDino = () => DINOS.find(d=>!P.hatched.includes(d.id));
function dinoSVG(id,w,h,flip){ const inner = flip ? `<g transform="translate(220 0) scale(-1 1)">${ART[id]}</g>` : ART[id]; return `<svg viewBox="0 0 220 170" width="${Math.round(w)}" height="${Math.round(h)}" aria-hidden="true">${inner}</svg>`; }
function eggSVG(w,h,fill,spot,set,stroke){ const sp = SPOTS[set||0].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${spot}"/>`).join(''); return `<svg aria-hidden="true" width="${w}" height="${h}" viewBox="-28 -34 56 68"><path d="${EGG}" fill="${fill}" stroke="#2E3A33" stroke-width="${stroke||2}"/>${sp}</svg>`; }

function defaults(){
  return { v:2, updatedAt:0, eggs:0, totalEggs:0, pendingHatch:false, hatched:['bronti','trici'], names:{}, newIds:[],
    settings:{ kidName:'Vilci', level:3, roundLen:3, games:{count:true, add:true, order:true} },
    stats:{ solved:{count:0, add:0, order:0}, rounds:0, days:{} } };
}
function normalize(p){
  const d = defaults();
  if(!p || typeof p!=='object') return d;
  const o = Object.assign(d, p);
  o.settings = Object.assign(defaults().settings, p.settings||{});
  o.settings.games = Object.assign(defaults().settings.games, (p.settings&&p.settings.games)||{});
  o.stats = Object.assign(defaults().stats, p.stats||{});
  o.stats.solved = Object.assign(defaults().stats.solved, (p.stats&&p.stats.solved)||{});
  o.stats.days = Object.assign({}, (p.stats&&p.stats.days)||{});
  o.hatched = Array.isArray(p.hatched) ? p.hatched.filter(id=>ART[id]) : ['bronti','trici'];
  if(!o.hatched.includes('bronti')) o.hatched.unshift('bronti');
  o.names = Object.assign({}, p.names||{});
  o.newIds = Array.isArray(p.newIds) ? p.newIds.filter(id=>ART[id]) : [];
  if(o.pendingHatch && !nextDinoOf(o)) o.pendingHatch = false;
  if(!(p.v >= 2)){ o.settings.level = 3; if(!o.settings.kidName) o.settings.kidName = 'Vilci'; }
  o.v = 2;
  if(![1,2,3].includes(o.settings.level)) o.settings.level = 3;
  delete o.settings.voice; delete o.settings.countAloud; delete o.settings.sound;
  return o;
}
function nextDinoOf(o){ return DINOS.find(d=>!o.hatched.includes(d.id)); }
function progressScore(o){ return (o.hatched ? o.hatched.length : 0)*1000 + (o.totalEggs||0)*10 + (o.eggs||0); }
function backupCode(){ try{ return 'DV1.' + btoa(unescape(encodeURIComponent(JSON.stringify(P)))); }catch(e){ return ''; } }
function readBackup(code){
  try{
    const c = String(code||'').replace(/\s+/g,'');
    if(c.slice(0,4)!=='DV1.') return null;
    const o = JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));
    if(!o || typeof o!=='object' || !Array.isArray(o.hatched) || !o.settings) return null;
    return normalize(o);
  }catch(e){ return null; }
}

function restoreSession(){
  try{
    const raw = localStorage.getItem(SS_KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || typeof d!=='object' || Date.now() - (d.at||0) > 14*24*3600*1000) return;
    if(GAMES[d.lastGame]) S.lastGame = d.lastGame;
    if(d.dexSel && ART[d.dexSel]) S.dexSel = d.dexSel;
    if(d.screen==='game' && d.game && d.game.task && GAMES[d.game.task.type]){
      S.game = d.game; S.screen = 'game';
      const t = S.game.task;
      if(t.type==='order' && !t.solved && t.k>=t.sorted.length){ t.k = t.sorted.length - 1; t.crossed = false; }
    } else if(d.screen==='hatch' && d.hatch && ART[d.hatch.id] && (d.hatch.opened || P.pendingHatch)){
      S.hatch = d.hatch; S.hatch.editing = false; S.screen = 'hatch';
      if(!S.hatch.opened && S.hatch.stage>=3) S.hatch.stage = 2;
    } else if(d.screen==='success' || d.screen==='dex'){
      S.screen = d.screen;
    }
  }catch(e){}
}

/* ---------- tasks ---------- */
function makeEggs(n){
  const AW=560, AH=330, X0=100, Y0=82;
  const cols = Math.max(3, Math.ceil(Math.sqrt(n*AW/AH)));
  const rows = Math.ceil(n/cols);
  const cw = AW/cols, ch = AH/rows;
  const ew = Math.round(Math.min(88, cw*0.8, ch*0.78)), eh = Math.round(ew*1.24);
  const cells = []; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) cells.push([r,c]);
  const chosen = shuffle(cells).slice(0,n).sort((p,q)=>p[0]-q[0] || p[1]-q[1]);
  const jx = Math.max(0,(cw-ew)/2-4), jy = Math.max(0,(ch-eh)/2-4);
  const pals = ['#E8945A','#8FB08A','#7FA9BF'];
  return chosen.map(([r,c],i)=>({
    x: Math.round(X0 + c*cw + (cw-ew)/2 + (Math.random()*2-1)*jx),
    y: Math.round(Y0 + r*ch + (ch-eh)/2 + (Math.random()*2-1)*jy),
    w: ew, h: eh, col: pals[(r+c+i)%3], set: ri(0,2)
  }));
}
function newTask(type){
  const L = P.settings.level;
  if(type==='count'){
    if(L===3){ const n = ri(21,99); return { type, big:true, n, tens:Math.floor(n/10), ones:n%10, set:ri(0,2), order:[], choices:choices100(n), wrong:false, solved:false, pop:null, wig:null }; }
    const n = L===1 ? ri(4,10) : ri(9,20);
    return { type, n, eggs:makeEggs(n), order:[], choices:choices(n,1,20), wrong:false, solved:false, pop:-1, wig:null };
  }
  if(type==='add'){
    if(L===3){
      let a, b;
      do{ a = ri(12,79); b = ri(4,59); } while(a+b > 99 || a+b < 25);
      return { type, big:true, a, b, pa:{t:Math.floor(a/10), o:a%10}, pb:{t:Math.floor(b/10), o:b%10}, bars:[], ones:[], fresh:null, choices:choices100(a+b), wrong:false, solved:false, wig:null };
    }
    let a, b;
    if(L===1){ const s = ri(3,10); a = ri(1,s-1); b = s-a; }
    else { let s; do{ a=ri(2,10); b=ri(2,10); s=a+b; } while(s<8 || s>18 || (s<=10 && Math.random()<0.7)); }
    return { type, a, b, tA:Array(a).fill(false), tB:Array(b).fill(false), seq:[], choices:choices(a+b,1,20), wrong:false, solved:false, wig:null };
  }
  const k = L===1 ? 4 : 5, max = L===1 ? 10 : L===2 ? 20 : 100;
  const set = new Set(); while(set.size<k) set.add(ri(1,max));
  if(L===3 && Math.random()<0.6){
    const arr = [...set];
    const cand = arr.filter(x=>x>=12 && x<=98 && x%10!==0 && Math.floor(x/10)!==x%10);
    if(cand.length){
      const x = pick(cand), r = (x%10)*10 + Math.floor(x/10);
      if(!set.has(r)){ set.delete(pick(arr.filter(y=>y!==x))); set.add(r); }
    }
  }
  const sorted = [...set].sort((x,y)=>x-y);
  let bank; do{ bank = shuffle(sorted.slice()); } while(bank.every((v,i)=>v===sorted[i]));
  return { type, sorted, bank, k:0, hint:false, solved:false, crossed:false, wig:null };
}

function countBody(t){
  if(t.big) return countBigBody(t);
  const counted = t.order.length;
  let msg;
  if(t.solved) msg = 'Köszönöm! Most már tudom, hány tojásom van.';
  else if(t.wrong) msg = 'Majdnem! Számoljuk meg együtt még egyszer.';
  else if(counted===0) msg = 'Segítesz megszámolni a tojásaimat?';
  else if(counted<t.n) msg = 'Ügyes! Folytasd, amíg minden tojás kap egy számot.';
  else msg = 'Mindet megérintetted! Mi volt az utolsó szám?';
  const popI = t.pop; t.pop = -1;
  const eggs = t.eggs.map((e,i)=>{
    const pos = t.order.indexOf(i);
    const b = Math.round(e.w*0.56), fs = Math.round(e.w*0.32);
    const badge = pos>=0 ? `<span class="badge" style="width:${b}px;height:${b}px;font-size:${fs}px;left:${Math.round((e.w-b)/2)}px;top:${Math.round(e.h*0.54-b/2)}px">${pos+1}</span>` : '';

      <g stroke="#C29361" stroke-width="4" stroke-linecap="round"><path d="M90 300 L140 290"/><path d="M150 420 L210 414"/><path d="M520 428 L580 418"/><path d="M630 300 L676 316"/><path d="M300 452 L360 454"/></g>

    ${dinoSVG('bronti',300,232,true)}

}

function cartonSVG(set){
  const pals = ['#E8945A','#8FB08A','#7FA9BF'];
  let cups = '';
  for(let r=0;r<2;r++) for(let c=0;c<5;c++){
    const x = 26 + c*28, y = 30 + r*34, col = pals[(r*5+c+set)%3];
    cups += `<ellipse cx="${x}" cy="${y+11}" rx="12" ry="5" fill="#A87A4C"/><g transform="translate(${x} ${y}) scale(.4)"><path d="${EGG}" fill="#FBF4E6" stroke="#2E3A33" stroke-width="3.5"/><circle cx="-6" cy="-8" r="5" fill="${col}"/><circle cx="7" cy="7" r="6" fill="${col}"/></g>`;
  }
  return `<svg aria-hidden="true" width="164" height="96" viewBox="0 0 164 96"><rect x="3" y="6" width="158" height="86" rx="16" fill="#C99A68" stroke="#9C6B3E" stroke-width="3"/>${cups}</svg>`;
}
function countBigBody(t){
  const sums = {}; let acc = 0;
  t.order.forEach(k=>{ acc += k[0]==='c' ? 10 : 1; sums[k] = acc; });
  const counted = t.order.length, total = t.tens + t.ones;
  const cDone = t.order.filter(k=>k[0]==='c').length;
  let msg;
  if(t.solved) msg = 'Köszönöm! Most már tudom, hány tojásom van.';
  else if(t.wrong) msg = 'Majdnem! Számoljuk újra: először a tartókat, tízesével.';
  else if(counted===0) msg = 'Egy tartóban 10 tojás van. Számold a tartókat tízesével: 10, 20, 30…';
  else if(counted===total) msg = 'Mindet megszámoltad! Mi volt az utolsó szám?';
  else if(cDone===t.tens && counted===t.tens && t.ones>0) msg = 'Most jöhetnek a tojások egyesével!';
  else msg = 'Ügyes! Folytasd!';
  const popK = t.pop; t.pop = null;
  const rows = Math.max(1, Math.ceil(t.tens/3)), ch = rows*96 + (rows-1)*24, y0 = 56 + Math.round((432-ch)/2);
  const pals = ['#E8945A','#8FB08A','#7FA9BF'];
  let items = '';
  for(let i=0;i<t.tens;i++){
    const k = 'c'+i, x = 24 + (i%3)*176, y = y0 + Math.floor(i/3)*120;
    const badge = sums[k] ? `<span class="badge">${sums[k]}</span>` : '';
    items += `<button class="carton ${popK===k?'pop':''}" data-act="cnt" data-k="${k}" aria-label="${sums[k] ? sums[k]+', megszámolt tartó' : 'Tojástartó, 10 tojás'}" style="left:${x}px;top:${y}px">${cartonSVG((i+t.set)%3)}${badge}</button>`;
  }
  for(let i=0;i<t.ones;i++){
    const k = 'e'+i, x = 576 + (i%3)*58, y = 170 + Math.floor(i/3)*70;
    const badge = sums[k] ? `<span class="badge">${sums[k]}</span>` : '';
    items += `<button class="legg ${popK===k?'pop':''}" data-act="cnt" data-k="${k}" aria-label="${sums[k] ? sums[k]+', megszámolt tojás' : 'Tojás'}" style="left:${x}px;top:${y}px">${eggSVG(52,64,'#FBF4E6',pals[(i+t.set)%3],(i+t.set)%3)}${badge}</button>`;
  }
  return `<div class="nest-panel">
    <svg aria-hidden="true" width="760" height="512" viewBox="0 0 760 512">
      <g fill="#CFE0C3"><ellipse cx="60" cy="490" rx="90" ry="34"/><ellipse cx="420" cy="500" rx="120" ry="30"/></g>
      <rect x="560" y="148" width="190" height="252" rx="48" fill="#B98552"/>
      <rect x="570" y="158" width="170" height="232" rx="40" fill="#D6AE78"/>
    </svg>
    <span class="cnt-lab" style="left:28px">Tojástartók</span>
    <span class="cnt-lab" style="left:574px">Egyes tojások</span>
    ${items}
  </div>
  <div class="side-col" style="left:828px;width:312px;height:512px">
    <div class="bubble" role="status">${msg}${t.wrong&&!t.solved?`<div><button class="btn btn-primary small" data-act="recount">${ICON.redo} Újraszámolom</button></div>`:''}</div>
    ${dinoSVG('bronti',300,232,true)}
  </div>
  ${t.solved ? doneSheet(`Igen! ${t.n} tojás: ${t.tens} tízes${t.ones ? ' és '+t.ones+' egyes' : ''}.`) : answerRow('Hány tojás van összesen?', t)}`;
}

/* addition */
function berrySVG(c){ const f = c==='a' ? '#E8945A' : '#5E8FB3', hi = c==='a' ? '#F5C29B' : '#9BBCD3'; return `<svg aria-hidden="true" width="46" height="46" viewBox="0 0 56 56"><circle cx="28" cy="31" r="22" fill="${f}"/><circle cx="20" cy="24" r="6" fill="${hi}"/><path d="M28 10 Q34 2 42 6 Q36 12 28 10 Z" fill="#5E8A5E"/></svg>`; }
function branchHTML(t, c){
  const arr = c==='a' ? t.tA : t.tB, n = arr.length;
  const color = c==='a' ? '#E8945A' : '#A9C9D6', word = c==='a' ? 'narancs' : 'kék';
  const items = arr.map((gone,i)=> gone ? `<span class="berry-gone"><span></span></span>` : `<button class="berry" data-act="berry" data-c="${c}" data-i="${i}" aria-label="${word} bogyó">${berrySVG(c)}</button>`).join('');
  return `<div class="branch"><div class="branch-lab"><span class="branch-num" style="background:${color}">${n}</span><span>${word}</span></div><div class="berries">${items}</div></div>`;
}
function frameHTML(t, from){
  let cells = '';
  for(let i=from;i<from+10;i++){ const k = t.seq[i]; cells += `<div class="cell">${k ? `<span class="${t.fresh && i===t.seq.length-1 ? 'new' : ''}" style="background:${k==='a'?'#E8945A':'#5E8FB3'}"></span>` : ''}</div>`; }
  return `<div class="frame">${cells}</div>`;
}
function addBody(t){
  if(t.big) return addBigBody(t);
  const s = t.a + t.b, n = t.seq.length, two = s > 10;
  const frames = frameHTML(t,0) + (two ? frameHTML(t,10) : ''); t.fresh = false;
  let msg;
  if(t.solved) msg = 'Nyamm, jóllaktam! Köszönöm!';
  else if(t.wrong) msg = two ? 'Nézd meg a tálat: 10, és még mennyi?' : 'Számold meg a bogyókat a tálban!';
  else if(n===0) msg = 'Éhes vagyok! Tedd a bogyókat a tálamba.';
  else if(n===s) msg = 'Mind a tálban! Hány bogyó ez összesen?';
  else if(two && n===10) msg = 'Az első tál tele van, abba pont 10 fér!';
  else msg = 'Nyamm! Még, még!';
  return `<div class="equation" role="img" aria-label="${t.a} meg ${t.b} egyenlő kérdőjel">
      <span class="eq-num" style="background:#E8945A">${t.a}</span><span class="eq-op">+</span><span class="eq-num" style="background:#A9C9D6">${t.b}</span><span class="eq-op">=</span><span class="eq-q">${t.solved ? s : '?'}</span>
    </div>
    <div class="branches">${branchHTML(t,'a')}${branchHTML(t,'b')}</div>
    <div class="bowl-panel">
      <div class="frames"><span class="frames-lab">Trici tála</span>${frames}</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center">
        <div class="bubble" role="status" style="--tail:110px;font-size:22px;padding:16px 20px">${msg}</div>
        ${dinoSVG('trici',268,207,true)}
      </div>
    </div>
    ${t.solved ? doneSheet(`${t.a} + ${t.b} = ${s}. Trici jóllakott!`) : answerRow('Hány bogyót eszik meg Trici?', t)}`;
}

const BERRY = {a:'#E8945A', b:'#5E8FB3'};
function twigsSVG(bars, w, h, bw, gap, newIdx, center){
  const r = bw/2, step = (h - 2*r) / 9;
  const off = center && bars.length ? Math.max(0, (w - (bars.length*bw + (bars.length-1)*gap))/2) : 0;
  const body = bars.map((bar,i)=>{
    const x = off + r + i*(bw+gap);
    const beads = bar.map((c,j)=>`<circle cx="${x.toFixed(1)}" cy="${(r + j*step).toFixed(1)}" r="${r.toFixed(1)}" fill="${BERRY[c]}"/>`).join('');
    return `<g class="${i===newIdx?'pv-new':''}"><rect x="${(x-1.5).toFixed(1)}" y="${r.toFixed(1)}" width="3" height="${(h-2*r).toFixed(1)}" rx="1.5" fill="#8A6B4E"/>${beads}</g>`;
  }).join('');
  return `<svg aria-hidden="true" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`;
}
function onesSVG(colors, cap, w, h, cols, rows, showEmpty, newIdx){
  const cw = w/cols, chh = h/rows, r = Math.min(cw, chh)/2 - 2;
  let out = '';
  for(let i=0;i<cap;i++){
    const cx = (i%cols)*cw + cw/2, cy = Math.floor(i/cols)*chh + chh/2;
    if(i < colors.length) out += `<circle class="${i===newIdx?'pv-new':''}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${BERRY[colors[i]]}"/>`;
    else if(showEmpty) out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r-1.5).toFixed(1)}" fill="none" stroke="#D3C6AF" stroke-width="2.5" stroke-dasharray="4 4"/>`;
  }
  return `<svg aria-hidden="true" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${out}</svg>`;
}
function pileHTML(t, c, kind){
  const p = c==='a' ? t.pa : t.pb, n = kind==='t' ? p.t : p.o;
  const word = c==='a' ? 'narancs' : 'kék';
  const art = kind==='t'
    ? twigsSVG(Array.from({length:n}, ()=>Array(10).fill(c)), 148, 112, 12, 8, -1, true)
    : onesSVG(Array(n).fill(c), 10, 50, 112, 2, 5, false, -1);
  const aria = (kind==='t' ? word+' tízes fürt' : word+' egyes bogyó') + ', még ' + n;
  return `<button class="pile ${kind==='t'?'tens':'ones'}" data-act="pile" data-c="${c}" data-k="${kind}" aria-label="${aria}" ${n?'':'disabled'}>${art}<span class="pile-lab">${kind==='t'?'tízesek':'egyesek'}</span></button>`;
}
function bigBranchHTML(t, c){
  const n = c==='a' ? t.a : t.b, color = c==='a' ? '#E8945A' : '#A9C9D6', word = c==='a' ? 'narancs' : 'kék';
  return `<div class="branch"><div class="branch-lab"><span class="branch-num" style="background:${color}">${n}</span><span>${word}</span></div>${pileHTML(t,c,'t')}${pileHTML(t,c,'o')}</div>`;
}
function addBigBody(t){
  const s = t.a + t.b, left = t.pa.t + t.pa.o + t.pb.t + t.pb.o, moved = t.bars.length*10 + t.ones.length;
  const fresh = t.fresh; t.fresh = null;
  let msg;
  if(t.solved) msg = 'Nyamm, jóllaktam! Köszönöm!';
  else if(t.wrong) msg = 'Számold a fürtöket tízesével, aztán a bogyókat egyesével!';
  else if(fresh==='bundle') msg = 'Tíz bogyó összeállt egy tízes fürtté!';
  else if(moved===0) msg = 'Éhes vagyok! Koppints a fürtökre és a bogyókra.';
  else if(left===0) msg = 'Mind a tálban! Hány bogyó ez összesen?';
  else msg = 'Nyamm! Még, még!';
  const barNew = (fresh==='bar' || fresh==='bundle') ? t.bars.length-1 : -1;
  const oneNew = fresh==='one' ? t.ones.length-1 : -1;
  return `<div class="equation" role="img" aria-label="${t.a} meg ${t.b} egyenlő kérdőjel">
      <span class="eq-num" style="background:#E8945A">${t.a}</span><span class="eq-op">+</span><span class="eq-num" style="background:#A9C9D6">${t.b}</span><span class="eq-op">=</span><span class="eq-q">${t.solved ? s : '?'}</span>
    </div>
    <div class="branches">${bigBranchHTML(t,'a')}${bigBranchHTML(t,'b')}</div>
    <div class="bowl-panel">
      <div class="frames"><span class="frames-lab">Trici tála</span>
        <div class="mat">
          <div class="mat-col tens"><span class="mat-lab">tízesek</span>${twigsSVG(t.bars, 176, 140, 14, 6, barNew)}</div>
          <div class="mat-col ones"><span class="mat-lab">egyesek</span>${onesSVG(t.ones, 10, 60, 140, 2, 5, true, oneNew)}</div>
        </div>
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center">
        <div class="bubble" role="status" style="--tail:110px;font-size:22px;padding:16px 20px">${msg}</div>
        ${dinoSVG('trici',268,207,true)}
      </div>
    </div>
    ${t.solved ? doneSheet(`${t.a} + ${t.b} = ${s}. Trici jóllakott!`) : answerRow('Hány bogyót eszik meg Trici?', t)}`;
}

/* ordering */
function slotX(i,k){ const x0=300, x1=800; return k>1 ? x0 + i*(x1-x0)/(k-1) : (x0+x1)/2; }
function orderBody(t){
  const k = t.sorted.length, done = t.k===k;
  let msg;
  if(done) msg = t.solved ? 'Hazaértem! Köszönöm a segítséget!' : 'Kész az ösvény! Indulok haza!';
  else if(t.hint) msg = 'Hoppá! Van ennél kisebb kő is a parton.';
  else if(t.k===0) msg = 'Segíts átkelni! Melyik a legkisebb szám?';
  else msg = 'Szuper! Melyik szám jön utána?';
  const wig = t.wig; t.wig = null;
  const rs = ['r1','r2','r3'];
  const slots = t.sorted.map((v,i)=>{ const left = Math.round(slotX(i,k)-52); return i<t.k ? `<div class="slot full ${rs[i%3]} ${t.fresh && i===t.k-1 ? 'new' : ''}" style="left:${left}px">${v}</div>` : `<div class="slot empty ${rs[i%3]}" style="left:${left}px" aria-hidden="true"></div>`; }).join('');
  t.fresh = false;
  const stones = t.bank.map((v,i)=> t.sorted.indexOf(v) < t.k ? `<span class="stone-gone ${rs[i%3]}" aria-hidden="true"></span>` : `<button class="stone ${rs[i%3]} ${wig===v?'wiggle':''}" data-act="stone" data-v="${v}">${v}</button>`).join('');
  return `<div class="river-panel">

        <g fill="#94B98C"><ellipse cx="80" cy="410" rx="140" ry="40"/><ellipse cx="1010" cy="410" rx="140" ry="40"/></g>
        <path d="M1050 300 Q1042 220 1058 140" stroke="#8A6B4E" stroke-width="10" fill="none" stroke-linecap="round"/>
        <g fill="#5E8A5E"><ellipse cx="1030" cy="138" rx="40" ry="11" transform="rotate(-24 1030 138)"/><ellipse cx="1086" cy="136" rx="40" ry="11" transform="rotate(22 1086 136)"/><ellipse cx="1058" cy="122" rx="11" ry="34"/></g>
        <ellipse cx="970" cy="330" rx="74" ry="24" fill="#B98552"/>
        <g fill="#FBF4E6" stroke="#2E3A33" stroke-width="2.5"><path transform="translate(948 304) scale(0.8)" d="${EGG}"/><path transform="translate(990 300) scale(0.8)" d="${EGG}"/></g>
        <path d="M904 326 Q970 360 1036 326 Q1030 352 970 356 Q910 352 904 326 Z" fill="#9C6B3E"/>
      </svg>
      ${slots}
      <div class="walker" id="walker" style="${t.crossed ? 'transform:translate(880px,0px)' : ''}">${dinoSVG('bronti',202,156,false)}</div>
      <div class="river-bubble"><div class="bubble" role="status" style="--tail:90px">${msg}</div></div>
    </div>
    ${t.solved ? doneSheet('Bronti hazaért! Ügyes vagy!') : `<div class="tray"><span class="tray-lab">Számkövek a parton</span><div class="tray-row">${stones}</div></div>`}`;
}

function gameHTML(){
  const g = S.game, t = g.task;

}

    <div class="success-art"><svg aria-hidden="true" width="520" height="320" viewBox="0 0 520 320">

      <g fill="#F2C76B"><path transform="translate(404 62) scale(1.2)" d="${STAR}"/></g>
      <g fill="#8FB08A"><path transform="translate(84 196) scale(0.9)" d="${STAR}"/><path transform="translate(330 30) scale(0.6)" d="${STAR}"/></g>

/* ---------- render ---------- */
function render(){
  let html = '';
  if(S.screen==='game' && S.game) html = gameHTML();
  else if(S.screen==='success') html = successHTML();
  else if(S.screen==='hatch' && S.hatch) html = hatchHTML();
  else if(S.screen==='dex') html = dexHTML();
  else if(S.screen==='parent') html = parentHTML();
  else { S.screen = 'home'; html = homeHTML(); }
  stage.innerHTML = html;
  saveSession();
}
function go(screen){
  S.screen = screen;
  if(screen!=='parent'){ S.confirmReset = false; S.bk = null; }
  if(screen!=='dex') S.dexEdit = false;
  render();
}

/* ---------- game flow ---------- */
function startGame(type){
  if(!P.settings.games[type]) type = ['count','add','order'].find(g=>P.settings.games[g]) || 'count';
  S.lastGame = type;
  S.game = { type, idx:0, total:P.settings.roundLen, task:newTask(type) };
  go('game');
}
function solve(){
  const t = S.game.task;
  t.solved = true;
  P.stats.solved[t.type] = (P.stats.solved[t.type]||0) + 1;
  const d = today(); P.stats.days[d] = (P.stats.days[d]||0) + 1;
  const keys = Object.keys(P.stats.days).sort(); while(keys.length>60) delete P.stats.days[keys.shift()];
  save();
  render();
}
function nextTask(){
  const g = S.game;
  if(g.idx + 1 < g.total){ g.idx++; g.task = newTask(g.type); render(); }
  else finishRound();
}
function finishRound(){
  P.stats.rounds = (P.stats.rounds||0) + 1;
  P.totalEggs = (P.totalEggs||0) + 1;
  if(!allHatched()){ P.eggs = Math.min(3, P.eggs + 1); if(P.eggs>=3) P.pendingHatch = true; }
  save();
  S.game = null;
  go('success');
}
function answer(v){
  const t = S.game.task; if(t.solved) return;
  const correct = t.type==='count' ? t.n : t.a + t.b;
  if(v===correct) return solve();
  t.wrong = true; t.wig = v;
  render();
}
function eggTap(i){
  const t = S.game.task; if(t.solved || t.order.includes(i)) return;
  t.order.push(i); t.pop = i; t.wrong = false;
  render();
}
function cntTap(key){
  const t = S.game.task; if(t.solved || t.order.includes(key)) return;
  t.order.push(key); t.pop = key; t.wrong = false;
  render();
}
function pileTap(c, kind){
  const t = S.game.task; if(t.solved) return;
  const p = c==='a' ? t.pa : t.pb;
  if(kind==='t'){ if(!p.t) return; p.t--; t.bars.push(Array(10).fill(c)); t.fresh = 'bar'; }
  else {
    if(!p.o) return;
    p.o--; t.ones.push(c); t.fresh = 'one';
    if(t.ones.length===10){ t.bars.push(t.ones); t.ones = []; t.fresh = 'bundle'; }
  }
  t.wrong = false;
  render();
}
function berryTap(c,i){
  const t = S.game.task; if(t.solved) return;
  const arr = c==='a' ? t.tA : t.tB; if(arr[i]) return;
  arr[i] = true; t.seq.push(c); t.wrong = false; t.fresh = true;
  render();
}
function stoneTap(v){
  const t = S.game.task; if(t.solved || t.k>=t.sorted.length) return;
  if(t.sorted.indexOf(v) < t.k) return;
  if(v===t.sorted[t.k]){
    t.k++; t.hint = false; t.fresh = true;
    render();
    if(t.k===t.sorted.length) cross();
  } else {
    t.hint = true; t.wig = v; render();
  }
}
function cross(){
  const t = S.game.task, k = t.sorted.length;
  const walker = document.getElementById('walker');
  const finish = () => { t.crossed = true; if(S.screen==='game' && S.game && S.game.task===t) solve(); };
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!walker || typeof walker.animate!=='function' || reduce){ setTimeout(finish, 300); return; }
  const frames = [{transform:'translate(0px,0px)'}];
  let px = 0;
  for(let i=0;i<k;i++){
    const x = Math.round(slotX(i,k) - 101 - 14);
    frames.push({transform:`translate(${Math.round((px+x)/2)}px,-205px)`});
    frames.push({transform:`translate(${x}px,-137px)`});
    px = x;
  }
  frames.push({transform:`translate(${Math.round((px+880)/2)}px,-170px)`});
  frames.push({transform:'translate(880px,0px)'});
  const per = 420;
  const anim = walker.animate(frames, {duration: per*(k+1), easing:'ease-in-out', fill:'forwards'});
  anim.onfinish = finish;
}

/* hatching flow */
function openHatch(){
  const d = nextDino();
  if(!d){ P.pendingHatch = false; save(); return go('dex'); }
  S.hatch = { id:d.id, stage:0, opened:false, editing:false };
  go('hatch');
}
function crackTap(){
  const h = S.hatch; if(!h || h.opened || h.stage>=3) return;
  h.stage++;
  saveSession();
  const svg = stage.querySelector('.hatch-svg');
  svg.classList.add('st'+h.stage);
  const egg = svg.querySelector('.egg-anim');
  egg.classList.remove('knock'); void egg.getBoundingClientRect(); egg.classList.add('knock');
  document.getElementById('hatch-text').innerHTML = hatchTextHTML();
  if(h.stage>=3) setTimeout(openEgg, 420);
}
function openEgg(){
  const h = S.hatch; if(!h || h.opened) return;
  h.opened = true;
  if(!P.hatched.includes(h.id)) P.hatched.push(h.id);
  if(!P.newIds.includes(h.id)) P.newIds.push(h.id);
  P.eggs = Math.max(0, P.eggs - 3); P.pendingHatch = false;
  save();
  const svg = stage.querySelector('.hatch-svg');
  if(svg) svg.classList.add('opened');
  const hit = stage.querySelector('.egg-hit'); if(hit) hit.remove();
  saveSession();
  setTimeout(()=>{ if(S.screen==='hatch' && S.hatch===h){ document.getElementById('hatch-text').innerHTML = hatchTextHTML(); } }, 1000);
}
function commitName(ctx){
  const input = document.getElementById('dino-name');
  const id = ctx==='h' ? S.hatch.id : ((S.dexSel && P.hatched.includes(S.dexSel)) ? S.dexSel : P.hatched[P.hatched.length-1]);
  const v = input ? input.value.trim().slice(0,14) : '';
  if(v && v!==dinoById(id).name) P.names[id] = v; else delete P.names[id];
  save();
  if(ctx==='h'){ S.hatch.editing = false; document.getElementById('hatch-text').innerHTML = hatchTextHTML(); }
  else { S.dexEdit = false; render(); }
  saveSession();
}
function startRename(ctx){
  if(ctx==='h'){ S.hatch.editing = true; document.getElementById('hatch-text').innerHTML = hatchTextHTML(); }
  else { S.dexEdit = true; render(); }
  const input = document.getElementById('dino-name');
  if(input){ input.focus(); try{ input.select(); }catch(e){} }
}

/* valley */
let vbTimer = null;
function vdinoTap(id, btn){
  const art = btn.querySelector('.vd-art');
  art.classList.remove('bounce'); void art.offsetWidth; art.classList.add('bounce');
  const d = dinoById(id);
  const line = d.line.replace(d.name, dinoName(id));
  const old = stage.querySelector('.vbubble'); if(old) old.remove();
  const b = document.createElement('div');
  b.className = 'vbubble'; b.setAttribute('role','status'); b.textContent = line;
  const cx = btn.offsetLeft + btn.offsetWidth/2;
  b.style.left = Math.max(20, Math.min(1180-300, cx-140)) + 'px';
  b.style.top = Math.max(110, btn.offsetTop - 74) + 'px';
  stage.querySelector('.home').appendChild(b);
  clearTimeout(vbTimer); vbTimer = setTimeout(()=>{ b.remove(); }, 2800);
  if(P.newIds.includes(id)){ P.newIds = P.newIds.filter(x=>x!==id); save(); const nb = btn.querySelector('.newbadge'); if(nb) nb.remove(); }
}

/* ---------- events ---------- */
stage.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el || !stage.contains(el)) return;
  const act = el.dataset.act;
  switch(act){
    case 'home': S.game = null; go('home'); break;
    case 'start': startGame(el.dataset.g); break;
    case 'egg': eggTap(+el.dataset.i); break;
    case 'cnt': cntTap(el.dataset.k); break;
    case 'pile': pileTap(el.dataset.c, el.dataset.k); break;
    case 'recount': { const t = S.game.task; t.order = []; t.wrong = false; render(); break; }
    case 'answer': answer(+el.dataset.v); break;
    case 'berry': berryTap(el.dataset.c, +el.dataset.i); break;
    case 'stone': stoneTap(+el.dataset.v); break;
    case 'next': nextTask(); break;
    case 'again': startGame(S.lastGame); break;
    case 'hatch': openHatch(); break;
    case 'crack': crackTap(); break;
    case 'rename': startRename(el.dataset.ctx); break;
    case 'rename-ok': commitName(el.dataset.ctx); break;
    case 'tovalley': { const id = S.hatch && S.hatch.id; S.hatch = null; go('home'); const b = id && stage.querySelector(`.vdino[data-id="${id}"]`); if(b) setTimeout(()=>{ const a=b.querySelector('.vd-art'); a.classList.add('bounce'); }, 250); break; }
    case 'dex': S.dexSel = (S.hatch && S.hatch.opened) ? S.hatch.id : S.dexSel; go('dex'); break;
    case 'dexsel': { const id = el.dataset.id; S.dexSel = id; S.dexEdit = false; if(P.newIds.includes(id)){ P.newIds = P.newIds.filter(x=>x!==id); save(); } render(); break; }
    case 'vdino': vdinoTap(el.dataset.id, el); break;
    case 'set': { P.settings[el.dataset.k] = +el.dataset.v; save(); render(); break; }
    case 'gtoggle': { const g = el.dataset.g, games = P.settings.games; const on = Object.keys(games).filter(x=>games[x]); if(games[g] && on.length===1) break; games[g] = !games[g]; save(); render(); break; }
    case 'reset': S.confirmReset = true; render(); break;
    case 'reset-no': S.confirmReset = false; render(); break;
    case 'reset-yes': { const keep = P.settings; P = defaults(); P.settings = keep; S.confirmReset = false; S.bk = null; save(); render(); break; }
    case 'bk-copy': {
      const code = backupCode();
      let pr = null;
      try{ pr = navigator.clipboard && navigator.clipboard.writeText(code); }catch(err){ pr = null; }
      const fallback = () => { S.bk = 'show'; render(); const o = document.getElementById('bk-out'); if(o){ o.focus(); try{ o.select(); o.setSelectionRange(0, o.value.length); }catch(err){} } };
      if(pr && typeof pr.then==='function') pr.then(()=>{ S.bk = 'copied'; render(); }, fallback); else fallback();
      break;
    }
    case 'bk-load': { S.bk = 'load'; render(); const i = document.getElementById('bk-in'); if(i) i.focus(); break; }
    case 'bk-cancel': S.bk = null; render(); break;
    case 'bk-apply': applyBackup(); break;
  }
});
function applyBackup(){
  const i = document.getElementById('bk-in');
  const o = readBackup(i && i.value);
  if(!o){ S.bk = 'bad'; render(); const n = document.getElementById('bk-in'); if(n) n.focus(); return; }
  P = o; S.game = null; S.hatch = null; S.bk = 'loaded';
  save(); render();
}
stage.addEventListener('keydown', e=>{
  if(e.target && e.target.id==='bk-in' && e.key==='Enter'){ e.preventDefault(); applyBackup(); return; }
  if(e.target && e.target.id==='dino-name' && e.key==='Enter'){ e.preventDefault(); const b = stage.querySelector('[data-act="rename-ok"]'); if(b) commitName(b.dataset.ctx); }
});
stage.addEventListener('input', e=>{
  if(e.target && e.target.id==='kid-name'){ P.settings.kidName = e.target.value.slice(0,16); save(); }
});

/* parent gate: press and hold */
let holdTimer = null, holdEl = null, tipTimer = null;
stage.addEventListener('pointerdown', e=>{
  const el = e.target.closest('[data-hold]'); if(!el) return;
  holdEl = el; el.classList.add('holding');
  holdTimer = setTimeout(()=>{ holdTimer = null; if(holdEl) holdEl.classList.remove('holding'); holdEl = null; S.confirmReset = false; go('parent'); }, 2000);
});
function cancelHold(){
  if(!holdTimer) return;
  clearTimeout(holdTimer); holdTimer = null;
  if(holdEl){
    holdEl.classList.remove('holding');
    const tip = holdEl.parentNode && holdEl.parentNode.querySelector('.holdtip');
    if(tip){ tip.hidden = false; clearTimeout(tipTimer); tipTimer = setTimeout(()=>{ tip.hidden = true; }, 1800); }
  }
  holdEl = null;
}
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t, cancelHold));
stage.addEventListener('pointerout', e=>{ if(holdEl && e.target.closest('[data-hold]')===holdEl && !holdEl.contains(e.relatedTarget)) cancelHold(); });
stage.addEventListener('contextmenu', e=>{ if(e.target.closest('[data-hold]')) e.preventDefault(); });

/* ---------- fit to screen ---------- */
const fitEl = document.getElementById('fit');
const app = document.getElementById('app');
const hint = document.getElementById('rotate-hint');
function fit(){
  const portrait = window.innerHeight > window.innerWidth * 1.05;
  hint.hidden = !portrait;
  const cs = getComputedStyle(app);
  const w = app.clientWidth, h = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (portrait ? 40 : 0);
  const s = Math.max(0.1, Math.min(w/1180, h/820));
  fitEl.style.width = Math.floor(1180*s) + 'px';
  fitEl.style.height = Math.floor(820*s) + 'px';
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', ()=>setTimeout(fit, 120));
window.addEventListener('pagehide', saveSession);

/* ---------- boot ---------- */
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(!(e.target && e.target.closest && e.target.closest('input'))) e.preventDefault(); }, {passive:false});
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
restoreSession();
fit();
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
